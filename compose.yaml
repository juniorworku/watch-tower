services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      WATCHTOWER_DATABASE: /data/watchtower.sqlite3
    volumes:
      - watchtower-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  watchtower-data:
