services:
  db:
    image: postgres:17-bookworm
    env_file:
      - path: backend/.env.postgres
    volumes:
      - watchtower-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env.docker
    environment:
      WATCHTOWER_ENV_FILES: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WATCHTOWER_BACKEND_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  channel-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.app.channel_worker"]
    env_file:
      - path: backend/.env.docker
    environment:
      WATCHTOWER_ENV_FILES: "0"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${WATCHTOWER_FRONTEND_PORT:-3002}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
volumes:
  watchtower-postgres:
